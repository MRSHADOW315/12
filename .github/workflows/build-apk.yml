name: Build & Package Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle Build Tool
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Secrets & Keystore
        run: |
          # Decode debug keystore if base64 file exists
          if [ -f debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          
          # Prepare .env configuration file if missing
          if [ ! -f .env ] && [ -f .env.example ]; then
            echo "Copying .env.example to .env..."
            cp .env.example .env
          elif [ ! -f .env ]; then
            touch .env
          fi

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Clean Project
        run: ./gradlew clean --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate & Stage Generated APK
        id: locate_apk
        run: |
          mkdir -p apk-output
          echo "Searching for generated APK files..."
          
          # Find all APK files generated by the build
          find . -type f -name "*.apk" -not -path "*/intermediates/*"
          
          # Pick the primary debug APK
          PRIMARY_APK=$(find app/build/outputs/apk/debug . -type f -name "*.apk" -not -path "*/intermediates/*" | head -n 1)
          
          if [ -z "$PRIMARY_APK" ] || [ ! -f "$PRIMARY_APK" ]; then
            echo "::error::No APK file found after Gradle assembleDebug build!"
            exit 1
          fi
          
          echo "Identified APK: $PRIMARY_APK"
          cp "$PRIMARY_APK" apk-output/Kinsphere-debug.apk
          echo "apk_path=apk-output/Kinsphere-debug.apk" >> "$GITHUB_OUTPUT"
          ls -la apk-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kinsphere-debug-apk
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 14
