name: Build & Package Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Signing Keystore & Configuration
        run: |
          set -e
          echo "=== Preparing Build Environment ==="
          
          # Decode base64 debug keystore
          if [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          
          # If debug.keystore is missing or empty, generate a fallback debug keystore
          if [ ! -s debug.keystore ]; then
            echo "Generating fallback debug keystore..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          # Prepare environment secrets file
          if [ ! -f .env ] && [ -f .env.example ]; then
            echo "Creating .env from .env.example..."
            cp .env.example .env
          elif [ ! -f .env ]; then
            echo "Creating empty .env file..."
            touch .env
          fi
          
          ls -la debug.keystore .env

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Run Gradle Clean
        run: ./gradlew clean --no-daemon

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Locate & Stage Generated APK
        id: locate_apk
        run: |
          set -e
          mkdir -p apk-output
          echo "=== Searching for generated APK files ==="
          
          # List all APKs generated in the project
          find . -type f -name "*.apk" -print
          
          # Primary search for debug APK
          PRIMARY_APK=$(find app/build/outputs/apk/debug . -type f -name "*.apk" -not -path "*/intermediates/*" | head -n 1)
          
          if [ -z "$PRIMARY_APK" ] || [ ! -f "$PRIMARY_APK" ]; then
            echo "::error::No APK file found after Gradle assembleDebug build!"
            exit 1
          fi
          
          echo "Discovered APK: $PRIMARY_APK"
          cp "$PRIMARY_APK" apk-output/Kinsphere-debug.apk
          ls -la apk-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kinsphere-debug-apk
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 14
